name: Sector Rotation

on:
  workflow_run:
    workflows: ["Daily Stock Screening (500 Emiten IDX)"]
    types: [completed]
  schedule:
    # Independent recovery after close; no manual run required.
    - cron: "47 13 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sector-rotation.yml"
      - "screener/rotation.py"
      - "data/rotation_history.py"
      - "data/ihsg_fetcher.py"
      - "tests/test_ihsg_fetcher.py"
      - "web/rotation-core.js"
      - "web/rotation.js"
      - "tests/test_rotation_history.py"
      - "data/idx_sector_classification.json"

permissions:
  contents: write

concurrency:
  group: sector-rotation-writer
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check rotation freshness
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          current = hashlib.sha256(Path("web/dashboard_data.json").read_bytes()).hexdigest()
          try:
              report = json.loads(Path("web/sector_rotation_data.json").read_text())
              needed = (report.get("dashboard_sha256") != current or
                        report.get("schema_version") != 1 or report.get("status") != "ok" or
                        report.get("history_schema_version") != 1)
              extended = json.loads(Path("web/rotation_history_data.json").read_text())
              needed = needed or extended.get("dashboard_sha256") != current or extended.get("status") != "ok"
              # Retry failed benchmark/history fetches on automatic recovery, not indefinitely inside one run.
              needed = needed or extended.get("health", {}).get("stocks_fresh", 0) < extended.get("health", {}).get("stocks_requested", 0)
              needed = needed or any(b.get("status") == "stale_or_unavailable" for b in extended.get("benchmarks", {}).values())
          except (OSError, ValueError):
              needed = True
          needed = needed or os.environ["EVENT_NAME"] in {"push", "workflow_dispatch"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"run={str(needed).lower()}", file=out)
          print(f"Rotation generation required: {needed}")
          PY
      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install rotation dependencies
        if: steps.freshness.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Rotation regression tests
        if: steps.freshness.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_rotation*.py' -v
          python -m unittest discover -s tests -p 'test_ihsg*.py' -v
          node --check web/rotation-core.js
          node --check web/rotation.js
          node tests/test_rotation_ui.js
      - name: Restore historical stock cache
        if: steps.freshness.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/rotation_stock_history.json.gz
          key: rotation-history-v1-${{ runner.os }}-${{ hashFiles('web/dashboard_data.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rotation-history-v1-${{ runner.os }}-
      - name: Generate rotation
        if: steps.freshness.outputs.run == 'true'
        run: |
          for attempt in 1 2; do
            python -m screener.rotation && exit 0
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 20
          done
      - name: Save historical stock cache
        if: steps.freshness.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/rotation_stock_history.json.gz
          key: rotation-history-v1-${{ runner.os }}-${{ hashFiles('web/dashboard_data.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate publication contract
        if: steps.freshness.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("web/sector_rotation_data.json").read_text())
          dashboard = json.loads(Path("web/dashboard_data.json").read_text())
          assert data["market_data_date"] == dashboard["market_data_date"]
          assert data["status"] == "ok"
          for mode in data["modes"].values():
              assert len(mode["sectors"]) == 11
              assert mode["stocks"]
              for row in mode["stocks"]:
                  assert row["date"] == data["market_data_date"]
                  assert row["sector"] in {s["symbol"] for s in mode["sectors"]}
          extended = json.loads(Path("web/rotation_history_data.json").read_text())
          assert extended["status"] == "ok"
          assert extended["market_data_date"] == data["market_data_date"]
          assert extended["dashboard_sha256"] == data["dashboard_sha256"]
          assert extended["benchmarks"]["COMPOSITE"]["status"] == "ok"
          assert extended["views"]["COMPOSITE"]["sectors"]
          assert extended["stocks"]
          print(f"Validated {data['coverage']['valid']} stocks; extended history and benchmark contracts match")
          PY
      - name: Publish generated rotation
        if: steps.freshness.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/sector_rotation_data.json web/rotation_history_data.json data/rotation_index_history.json data/idx_sector_classification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish sector rotation results"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              python - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path("web/sector_rotation_data.json").read_bytes())
          current = hashlib.sha256(Path("web/dashboard_data.json").read_bytes()).hexdigest()
          extended = json.loads(Path("web/rotation_history_data.json").read_bytes())
          assert extended["dashboard_sha256"] == current, "Historical feed advanced during rotation"
          assert data["dashboard_sha256"] == current, "Dashboard advanced during rotation; retry on next automatic trigger"
          PY
              git push && exit 0
            fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              exit 1
            fi
            sleep 15
          done
          exit 1
      - name: Report status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Sector rotation: $JOB_STATUS. Uses the completed dashboard session, not wall-clock date." >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" != "success" ]; then
            echo "::error::Rotation failed; last valid dataset retained."
          fi
