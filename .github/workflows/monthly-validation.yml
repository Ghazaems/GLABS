name: Monthly VWAP Validation

on:
  schedule:
    # Minggu pertama setiap bulan, 02:00 UTC / 09:00 WIB.
    - cron: "0 2 1-7 * 0"

permissions:
  contents: write

concurrency:
  group: monthly-vwap-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      ROUND_TRIP_COST_PCT: "0.50"
      ROUND_TRIP_SLIPPAGE_PCT: "0.20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run next-open backtest
        run: python backtest.py

      - name: Evaluate information coefficient
        run: python evaluate_ic.py

      - name: Validate reports
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          results = pd.read_csv("backtest_results.csv")
          assert not results.empty
          assert "vwap_signal" in results.columns
          assert "return_20d_pct" in results.columns

          with open("web/backtest_data.json") as source:
              report = json.load(source)

          assert report.get("execution") == "next_session_open"
          assert report.get("total_sampel", 0) > 0
          PY

      - name: Commit validation reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results.csv web/backtest_data.json web/ic_data.json
          git diff --staged --quiet || git commit -m "chore: refresh VWAP validation $(date -u +%Y-%m-%d)"
          git push
