name: Weekly VWAP IC Validation

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, Sabtu. Tidak ada workflow_dispatch.
    - cron: "0 2 * * 6"

permissions:
  contents: write

concurrency:
  group: weekly-vwap-ic-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Cross-sectional IC 5D / 20D / 60D
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run no-lookahead backtest
        run: python backtest.py

      - name: Evaluate cross-sectional VWAP IC
        run: python evaluate_ic.py backtest_results.csv web/ic_data.json

      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("web/ic_data.json").read_text(encoding="utf-8"))
          assert report["methodology"]["type"] == "cross_sectional_per_date"
          assert report["methodology"]["no_time_series_per_stock"] is True
          assert set(report["horizon_results"]) == {"5", "20", "60"}
          print("Valid: cross-sectional IC 5D / 20D / 60D")
          PY

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results.csv web/backtest_data.json web/ic_data.json
          git diff --staged --quiet || git commit -m "chore: update weekly VWAP IC validation $(date -u +%Y-%m-%d)"
          git push
