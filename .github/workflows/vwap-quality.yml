name: VWAP Quality Gate

on:
  pull_request:
    paths:
      - "**.py"
      - "web/**.html"
      - "web/**.js"
      - "web/**.css"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q analysis_contract.py main.py backtest.py forward_test.py evaluate_ic.py evaluate_wyckoff.py screener data storage tests
      - name: Validate dashboard JavaScript
        run: |
          node --check web/cockpit.js
          node --check web/api/chat.js
          node --check web/api/unlock.js
      - name: Unit tests
        run: python -m unittest discover -s tests -v
