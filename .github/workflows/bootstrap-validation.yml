name: Bootstrap Validation Reports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-validation.yml"

permissions:
  contents: write

concurrency:
  group: validation-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build validation reports from latest audited backtest
        run: |
          python evaluate_ic.py backtest_results.csv web/ic_data.json
          python evaluate_wyckoff.py backtest_results.csv web/wyckoff_ic_data.json

      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          vwap = json.loads(Path("web/ic_data.json").read_text(encoding="utf-8"))
          wyckoff = json.loads(Path("web/wyckoff_ic_data.json").read_text(encoding="utf-8"))
          assert vwap["methodology"]["type"] == "cross_sectional_per_date"
          assert set(vwap["horizon_results"]) == {"5", "20", "60"}
          assert wyckoff["methodology"]["type"] == "cross_sectional_per_date_per_event"
          assert set(wyckoff["timeframe_summary"]) == {"daily", "weekly", "swing"}
          PY

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/ic_data.json web/wyckoff_ic_data.json
          git diff --staged --quiet || git commit -m "chore: bootstrap VWAP and Wyckoff validation reports"
          git pull --rebase origin main
          git push
