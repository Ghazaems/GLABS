
name: Daily Backtest (500 Emiten IDX)

on:
  schedule:
    # 17:15 WIB (10:15 UTC) — setelah pipeline screening harian
    # Backtest historis penuh dijalankan setelah sesi; writer diserialkan
    - cron: "15 10 * * 1-5"   # Senin-Jumat saja

  workflow_dispatch: {}       # bisa trigger manual dari tab Actions di GitHub

permissions:
  contents: write

concurrency:
  group: generated-data-writer
  cancel-in-progress: false

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run backtest (500 ticker IDX)
        run: python backtest.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated backtest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/backtest_data.json backtest_results.csv
          git diff --staged --quiet || git commit -m "chore: update backtest data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push failed (attempt $attempt/5); retrying..."
            sleep $((attempt * 15))
          done
          exit 1
