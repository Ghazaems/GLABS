
name: Daily Backtest (962 Ticker IDX)

on:
  schedule:
    # 16:20 WIB (09:20 UTC) — 10 menit setelah forward test selesai
    # Backtest butuh waktu lebih lama karena proses data historis 3 tahun
    - cron: "20 9 * * 1-5"   # Senin-Jumat saja

  workflow_dispatch: {}       # bisa trigger manual dari tab Actions di GitHub

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # backtest butuh waktu lama (962 ticker × 3 tahun data)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest (962 ticker IDX)
        run: python backtest.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated backtest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/backtest_data.json backtest_results.csv
          git diff --staged --quiet || git commit -m "chore: update backtest data $(date -u +%Y-%m-%d)"
          git push
