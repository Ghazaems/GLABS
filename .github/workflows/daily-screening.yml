name: Daily Stock Screening (500 Emiten IDX)

on:
  schedule:
    # 09:15 UTC = 16:15 WIB, Senin-Jumat.
    # Tidak ada workflow_dispatch: pipeline tidak perlu dijalankan manual.
    - cron: "15 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: generated-data-writer
  cancel-in-progress: false

jobs:
  run-screening:
    name: Screen 500 IDX issuers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"
      JARVIS_API_TOKEN: ${{ secrets.JARVIS_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate ticker universe
        run: |
          python - <<'PY'
          from idx_tickers_500 import IDX_TICKERS_500

          assert len(IDX_TICKERS_500) == 500
          assert len(set(IDX_TICKERS_500)) == 500
          print("Valid: 500 ticker unik")
          PY

      - name: Run screening
        run: python main.py

      - name: Update forward test
        env:
          DB_PATH: storage/screener.db
          FORWARD_REPORT_PATH: web/forward_test_data.json
        run: python forward_test.py

      - name: Validate generated signals
        run: |
          python - <<'PY'
          import json

          with open(
              "web/dashboard_data.json",
              encoding="utf-8",
          ) as source:
              data = json.load(source)

          watchlist = data.get("watchlist", [])
          coverage = data.get(
              "summary",
              {},
          ).get("data_coverage", {})

          valid = [
              item
              for item in watchlist
              if item.get(
                  "vwap_analysis",
                  {},
              ).get("status") == "ok"
          ]

          allowed = {
              "BUY",
              "HOLD",
              "WAIT",
              "REDUCE",
              "EXIT",
              "AVOID",
          }

          invalid = [
              item.get("ticker")
              for item in valid
              if item.get("vwap_signal")
              not in allowed
          ]

          print(
              f"Coverage: {len(watchlist)}/"
              f"{coverage.get('requested')}"
          )
          print(f"VWAP valid: {len(valid)}")

          assert coverage.get("requested") == 500
          assert watchlist
          assert valid
          assert not invalid, invalid[:20]

          with open(
              "web/forward_test_data.json",
              encoding="utf-8",
          ) as source:
              forward = json.load(source)

          required = {
              "generated_at",
              "horizons_hari_bursa",
              "total_sampel_terdaftar",
              "total_sampel_matang",
              "by_signal",
              "by_vwap_signal",
              "by_timeframe",
              "detail_terbaru",
              "ic",
          }
          assert required.issubset(forward), (
              required - set(forward)
          )
          assert set(forward["by_timeframe"]) == {
              "daily",
              "weekly",
              "swing",
          }
          print("Forward-test contract valid")
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/dashboard_data.json web/forward_test_data.json storage/screener.db
          git diff --staged --quiet || git commit -m "chore: update screening data $(date -u +%Y-%m-%d)"
          git push
