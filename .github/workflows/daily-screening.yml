
name: Daily Stock Screening (962 Ticker IDX)

on:
  schedule:
    # 15:55 WIB (08:55 UTC) — 5 menit sebelum closing auction
    # Data hari itu mungkin belum lengkap, pakai data kemarin sebagai latest
    - cron: "55 8 * * 1-5"   # Senin-Jumat saja

    # Opsi alternatif: 16:05 WIB (09:05 UTC) — 5 menit setelah closing auction
    # Data hari itu sudah lengkap dan final
    # - cron: "5 9 * * 1-5"   # Senin-Jumat

  workflow_dispatch: {}       # bisa trigger manual dari tab Actions di GitHub

permissions:
  contents: write

jobs:
  run-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # yfinance-only + chunking harusnya jauh lebih cepat dari 30 menit lama
    env:
      JARVIS_API_TOKEN: ${{ secrets.JARVIS_API_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screening pipeline (962 ticker IDX)
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"  # biar log muncul real-time di GitHub Actions

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/dashboard_data.json storage/screener.db
          git diff --staged --quiet || git commit -m "chore: update screening data $(date -u +%Y-%m-%d)"
          git push
