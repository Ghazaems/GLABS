name: Daily Stock Screening (500 Emiten IDX)

on:
  schedule:
    # Watchdog setiap 30 menit pada 14:07-22:37 WIB, Senin-Jumat.
    # Slot sebelum penutupan hanya melakukan freshness check ringan.
    # Banyak slot mengurangi risiko event cron GitHub terlambat atau terlewat.
    - cron: "7,37 7-15 * * 1-5"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Daily Backtest (500 Emiten IDX)"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-screening.yml"

permissions:
  contents: write

concurrency:
  group: generated-data-writer
  cancel-in-progress: false

jobs:
  run-screening:
    name: Screen 500 IDX issuers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"
      JARVIS_API_TOKEN: ${{ secrets.JARVIS_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decide whether screening is required
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          WIB = ZoneInfo("Asia/Jakarta")
          MARKET_CLOSE = time(16, 15)
          LATE_RECOVERY_END = time(5, 0)
          now_wib = datetime.now(WIB)

          def previous_weekday(value):
              candidate = value - timedelta(days=1)
              while candidate.weekday() >= 5:
                  candidate -= timedelta(days=1)
              return candidate

          if now_wib.time() < LATE_RECOVERY_END:
              session_date = previous_weekday(now_wib.date())
              eligible = True
              timing_reason = "late-recovery"
          elif now_wib.time() < MARKET_CLOSE:
              session_date = previous_weekday(now_wib.date())
              eligible = os.environ.get("EVENT_NAME") != "schedule"
              timing_reason = "market-not-closed"
          else:
              session_date = now_wib.date()
              eligible = True
              timing_reason = "after-market-close"

          should_run = eligible
          reason = timing_reason

          if eligible and os.environ.get("EVENT_NAME") != "workflow_dispatch":
              try:
                  with open("web/dashboard_data.json", encoding="utf-8") as source:
                      payload = json.load(source)
                  completed_session = payload.get("screening_session_date")
                  should_run = completed_session != session_date.isoformat()
                  reason = (
                      "session-stale"
                      if should_run
                      else "session-already-complete"
                  )
              except (OSError, TypeError, ValueError) as exc:
                  should_run = True
                  reason = f"freshness-check-failed-{type(exc).__name__}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"run={str(should_run).lower()}", file=output)
              print(f"reason={reason}", file=output)
              print(f"session_date={session_date.isoformat()}", file=output)

          print(
              f"Run screening: {should_run}; "
              f"session={session_date.isoformat()}; reason={reason}"
          )
          PY

      - name: Setup Python
        if: steps.freshness.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.freshness.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        if: steps.freshness.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate ticker universe
        if: steps.freshness.outputs.run == 'true'
        run: |
          python - <<'PY'
          from idx_tickers_500 import IDX_TICKERS_500

          assert len(IDX_TICKERS_500) == 500
          assert len(set(IDX_TICKERS_500)) == 500
          print("Valid: 500 ticker unik")
          PY

      - name: Run screening
        if: steps.freshness.outputs.run == 'true'
        env:
          SCREENING_SESSION_DATE: ${{ steps.freshness.outputs.session_date }}
        run: |
          for attempt in 1 2; do
            python main.py && exit 0
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Screening gagal sementara; mencoba ulang dalam 30 detik."
            sleep 30
          done

      - name: Update forward test
        if: steps.freshness.outputs.run == 'true'
        env:
          DB_PATH: storage/screener.db
          FORWARD_REPORT_PATH: web/forward_test_data.json
        run: python forward_test.py

      - name: Validate generated signals
        if: steps.freshness.outputs.run == 'true'
        env:
          EXPECTED_SESSION_DATE: ${{ steps.freshness.outputs.session_date }}
        run: |
          python - <<'PY'
          import json
          import os

          with open(
              "web/dashboard_data.json",
              encoding="utf-8",
          ) as source:
              data = json.load(source)

          watchlist = data.get("watchlist", [])
          coverage = data.get(
              "summary",
              {},
          ).get("data_coverage", {})

          valid = [
              item
              for item in watchlist
              if item.get(
                  "vwap_analysis",
                  {},
              ).get("status") == "ok"
          ]

          allowed = {
              "BUY",
              "HOLD",
              "WAIT",
              "REDUCE",
              "EXIT",
              "AVOID",
          }

          invalid = [
              item.get("ticker")
              for item in valid
              if item.get("vwap_signal")
              not in allowed
          ]

          print(
              f"Coverage: {len(watchlist)}/"
              f"{coverage.get('requested')}"
          )
          print(f"VWAP valid: {len(valid)}")

          assert coverage.get("requested") == 500
          assert coverage.get("quality_gate") == "passed"
          assert coverage.get("fetch_coverage_pct", 0) >= 90
          assert coverage.get("success_coverage_pct", 0) >= 90
          assert coverage.get("dominant_market_date_pct", 0) >= 90
          assert watchlist
          assert valid
          assert not invalid, invalid[:20]
          assert data.get("market_data_date")
          assert data.get("screening_session_date") == os.environ[
              "EXPECTED_SESSION_DATE"
          ]

          with open(
              "web/forward_test_data.json",
              encoding="utf-8",
          ) as source:
              forward = json.load(source)

          required = {
              "generated_at",
              "horizons_hari_bursa",
              "total_sampel_terdaftar",
              "total_sampel_matang",
              "by_signal",
              "by_vwap_signal",
              "by_timeframe",
              "detail_terbaru",
              "ic",
          }
          assert required.issubset(forward), (
              required - set(forward)
          )
          assert set(forward["by_timeframe"]) == {
              "daily",
              "weekly",
              "swing",
          }
          print("Forward-test contract valid")
          PY

      - name: Commit generated data
        if: steps.freshness.outputs.run == 'true'
        env:
          SCREENING_SESSION_DATE: ${{ steps.freshness.outputs.session_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/dashboard_data.json web/forward_test_data.json storage/screener.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: update screening data ${SCREENING_SESSION_DATE}"
            git pull --rebase origin main
            for attempt in 1 2 3 4 5; do
              git push && exit 0
              echo "Push failed (attempt $attempt/5); retrying..."
              sleep $((attempt * 15))
            done
            exit 1
          else
            echo "Tidak ada perubahan data untuk di-commit."
          fi
